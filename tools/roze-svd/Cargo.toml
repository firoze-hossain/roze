[package]
name = "roze-svd"
version = "1.0.0"
edition = "2021"
description = "CMSIS-SVD XML Parser and Peripheral Access Crate (PAC) Generator for Roze"

[lib]
name = "roze_svd"
path = "src/lib.rs"

[[bin]]
name = "roze-svd"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
colored = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
tempfile = "3.0"
