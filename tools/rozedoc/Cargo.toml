[package]
name = "rozedoc"
version = "1.0.0"
edition = "2021"
description = "Automated Documentation Generator for Roze with live playground support"

[lib]
name = "rozedoc"
path = "src/lib.rs"

[[bin]]
name = "rozedoc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
colored = "2.1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
roze-compiler = { path = "../../compiler" }

[dev-dependencies]
tempfile = "3.0"

