name: Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download H2 database (for the SQL intrinsics golden test)
        run: |
          curl -fsSL -o /tmp/h2.jar https://github.com/h2database/h2database/releases/download/version-2.4.240/h2-2.4.240.jar
          echo "ROZE_TEST_JDBC_JAR=/tmp/h2.jar" >> "$GITHUB_ENV"

      - name: cargo test (workspace)
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true # tighten to a hard failure once the existing warnings are cleared
